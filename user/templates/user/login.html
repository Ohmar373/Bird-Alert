{% extends "base.html" %}

{% block title %}Log In - Bird Alert{% endblock %}

{% block content %}

<div class="form-container">
  <div class="form-wrapper">
    <h2>Log In</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        {{ form.as_p }}
      </div>
      <button type="submit" class="submit-btn">Log In</button>
    </form>
    <p class="form-link" style="margin-top: 1rem;"><a href="{% url 'password_reset' %}">Forgot Password?</a></p>
    <p class="form-link">Don't have an account? <a href="{% url 'register' %}">Sign Up</a></p>
  </div>
</div>

{% endblock %}
