{% extends "base.html" %}

{% block title %}Sign Up - Bird Alert{% endblock %}

{% block content %}

<div class="form-container">
  <div class="form-wrapper">
    <h2>Sign Up</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        {{ form.as_p }}
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>
    <p class="form-link">Already have an account? <a href="{% url 'login' %}">Log In</a></p>
  </div>
</div>

{% endblock %}
