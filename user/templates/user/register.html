{% extends "base.html" %}

{% block title %}Sign Up - Bird Alert{% endblock %}

{% block content %}

<div class="form-container">
  <div class="form-wrapper">
    <h2>Sign Up</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        {{ form.as_p }}
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>
    <p class="form-link">Already have an account? <a href="{% url 'login' %}">Log In</a></p>
  </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
  (function () {
    const eyeOpenIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const eyeHiddenIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.93 10.93 0 0 1 12 20C5 20 1 12 1 12a20.46 20.46 0 0 1 5.06-6.94"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-3.17 4.53"></path><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path><path d="M1 1l22 22"></path></svg>';

    function updateToggleState(passwordInput, eyeButton) {
      const isHidden = passwordInput.type === "password";
      eyeButton.setAttribute("aria-label", isHidden ? "Show password" : "Hide password");
      eyeButton.title = isHidden ? "Show password" : "Hide password";
      eyeButton.innerHTML = isHidden ? eyeHiddenIcon : eyeOpenIcon;
    }

    function addPasswordToggles() {
      const passwordInputs = document.querySelectorAll('input[type="password"]');

      passwordInputs.forEach(function (passwordInput) {
        if (passwordInput.dataset.eyeReady === "true") {
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.style.position = "relative";

        passwordInput.parentNode.insertBefore(wrapper, passwordInput);
        wrapper.appendChild(passwordInput);

        passwordInput.style.paddingRight = "3rem";

        const eyeButton = document.createElement("button");
        eyeButton.type = "button";
        eyeButton.style.position = "absolute";
        eyeButton.style.top = "50%";
        eyeButton.style.right = "0.5rem";
        eyeButton.style.transform = "translateY(-50%)";
        eyeButton.style.display = "flex";
        eyeButton.style.alignItems = "center";
        eyeButton.style.justifyContent = "center";
        eyeButton.style.width = "2rem";
        eyeButton.style.height = "2rem";
        eyeButton.style.border = "none";
        eyeButton.style.borderRadius = "4px";
        eyeButton.style.background = "transparent";
        eyeButton.style.cursor = "pointer";
        eyeButton.style.color = "#666";
        updateToggleState(passwordInput, eyeButton);

        eyeButton.addEventListener("click", function () {
          passwordInput.type = passwordInput.type === "password" ? "text" : "password";
          updateToggleState(passwordInput, eyeButton);
        });

        wrapper.appendChild(eyeButton);
        passwordInput.dataset.eyeReady = "true";
      });
    }

    addPasswordToggles();

    {% if form.errors %}
    const errors = [
      {% for field, field_errors in form.errors.items %}
        {% for error in field_errors %}
          "{{ error|escapejs }}",
        {% endfor %}
      {% endfor %}
    ];

    if (errors.length) {
      alert("Please fix the following:\n\n" + errors.join("\n"));
    }
    {% endif %}
  })();
</script>
{% endblock %}
